<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻量 JSON 阅读器</title>
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-soft: #f9fafc;
  --border: #d9dee8;
  --border-strong: #b8c0cf;
  --text: #1f2937;
  --muted: #667085;
  --faint: #98a2b3;
  --accent: #2563eb;
  --accent-soft: #eaf1ff;
  --danger: #b42318;
  --shadow: 0 16px 40px rgba(16, 24, 40, 0.08);
  --mono: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", sans-serif;
  --cell-font-size: 13px;
  --row-padding-y: 8px;
  --page-pad: clamp(12px, 2vw, 28px);
}
[data-theme="dark"] {
  --bg: #111827;
  --surface: #182230;
  --surface-soft: #202b3a;
  --border: #344054;
  --border-strong: #475467;
  --text: #f2f4f7;
  --muted: #cbd5e1;
  --faint: #94a3b8;
  --accent: #7aa7ff;
  --accent-soft: #1e355d;
  --danger: #ff9c8f;
  --shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.app {
  height: 100vh;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto 1fr auto;
  gap: 12px;
  padding: calc(var(--menu-height, 92px) + 18px) var(--page-pad) 18px;
  overflow: hidden;
}
main {
  min-height: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.menu-shell {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 20;
  display: grid;
  gap: 12px;
  padding: 18px var(--page-pad) 12px;
  background: var(--bg);
}
.topbar, .toolbar, .statusbar, .table-wrap, .upload-zone, .modal {
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 16px;
  border-radius: 16px;
}
.brand h1 { margin: 0; font-size: 20px; line-height: 1.2; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; font-family: var(--mono); }
.top-actions, .toolbar-row, .filter-row, .pagination, .modal-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.toolbar {
  display: none;
  padding: 10px;
  border-radius: 14px;
}
.toolbar.visible { display: block; }
.file-tabs {
  display: none;
  align-items: center;
  gap: 8px;
  min-width: 0;
  overflow-x: auto;
  padding: 2px 1px;
}
.file-tabs.visible { display: flex; }
.file-tab-wrap {
  display: inline-flex;
  max-width: 280px;
  align-items: stretch;
}
.file-tab {
  min-width: 120px;
  max-width: 240px;
  justify-content: flex-start;
  white-space: nowrap;
  border-top-right-radius: 0;
  border-bottom-right-radius: 0;
}
.file-tab span {
  overflow: hidden;
  text-overflow: ellipsis;
}
.tab-close {
  width: 32px;
  min-height: 32px;
  border: 1px solid var(--border);
  border-left: 0;
  border-radius: 0 9px 9px 0;
  background: var(--surface-soft);
  color: var(--muted);
}
.tab-close:hover {
  color: var(--danger);
  background: var(--accent-soft);
}
.toolbar-row + .toolbar-row {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.stats { margin-right: auto; color: var(--muted); font-family: var(--mono); font-size: 12px; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 32px;
  padding: 6px 11px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface-soft);
  color: var(--text);
  transition: border-color .12s ease, background .12s ease, transform .12s ease;
}
.btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.btn:active { transform: translateY(1px); }
.btn.primary { color: white; background: var(--accent); border-color: var(--accent); }
[data-theme="dark"] .btn.primary { color: #0b1220; }
.btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.field, select {
  min-height: 32px;
  padding: 6px 9px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface);
}
.search { min-width: min(320px, 60vw); }
.upload-zone {
  display: grid;
  place-items: center;
  min-height: 280px;
  border-style: dashed;
  border-radius: 18px;
  text-align: center;
  color: var(--muted);
}
.upload-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }
.upload-card h2 { margin: 0 0 8px; color: var(--text); font-size: 22px; }
.upload-card p { margin: 0 0 16px; }
.table-wrap {
  display: none;
  width: 100%;
  min-height: 0;
  min-width: 0;
  max-width: 100%;
  overflow: auto;
  border-radius: 14px;
  scrollbar-gutter: stable;
}
.table-wrap.visible { display: block; }
.table-wrap.visible {
  flex: 1;
  height: 100%;
}
table {
  min-width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-variant-numeric: tabular-nums;
}
thead { z-index: 4; }
.freeze-header thead {
  position: sticky;
  top: 0;
}
th, td {
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
th:last-child, td:last-child { border-right: 0; }
th {
  position: relative;
  height: 38px;
  padding: 0;
  background: var(--surface-soft);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  user-select: none;
}
th .th-button {
  width: 100%;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 18px 0 10px;
  border: 0;
  background: transparent;
  text-align: left;
}
th .th-label {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
th.sorted { color: var(--accent); }
.resizer {
  position: absolute;
  top: 4px;
  right: -4px;
  width: 9px;
  height: calc(100% - 8px);
  border: 0;
  border-radius: 999px;
  background: transparent;
  cursor: col-resize;
  z-index: 6;
}
.resizer::after {
  content: "";
  display: block;
  width: 2px;
  height: 100%;
  margin: 0 auto;
  border-radius: 999px;
}
.resizer:hover::after, .resizer.active::after { background: var(--accent); }
td {
  max-width: 420px;
  padding: var(--row-padding-y) 10px;
  background: var(--surface);
  color: var(--text);
  font-family: var(--mono);
  font-size: var(--cell-font-size);
  line-height: 1.45;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
tr:hover td { background: var(--accent-soft); }
td.index, th.index { width: 52px; min-width: 52px; max-width: 52px; text-align: center; color: var(--faint); }
td.index { font-size: 12px; }
.freeze-column th.index,
.freeze-column td.index {
  position: sticky;
  left: 0;
  z-index: 3;
}
.freeze-column th.index {
  z-index: 7;
  background: var(--surface-soft);
}
.freeze-column td.index {
  background: var(--surface);
  box-shadow: 1px 0 0 var(--border);
}
.freeze-column tr:hover td.index { background: var(--accent-soft); }
.freeze-selected-column th.frozen,
.freeze-selected-column td.frozen {
  position: sticky;
  z-index: 3;
}
.freeze-selected-column th.frozen {
  z-index: 7;
  background: var(--surface-soft);
}
.freeze-selected-column td.frozen {
  background: var(--surface);
  box-shadow: -1px 0 0 var(--border), -18px 0 24px rgba(22, 31, 48, 0.08);
}
.freeze-selected-column tr:hover td.frozen { background: var(--accent-soft); }
.cell-link {
  display: inline-flex;
  max-width: 100%;
  align-items: center;
  gap: 3px;
  color: var(--accent);
  text-decoration: none;
  vertical-align: bottom;
}
.cell-link:hover { text-decoration: underline; }
.freeze-dropdown {
  position: relative;
}
.freeze-dropdown summary {
  display: inline-flex;
  min-height: 32px;
  min-width: 148px;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface-soft);
  color: var(--text);
  list-style: none;
  cursor: pointer;
}
.freeze-dropdown summary::-webkit-details-marker { display: none; }
.freeze-dropdown summary::after {
  color: var(--muted);
  content: "▾";
  font-size: 11px;
}
.freeze-dropdown[open] summary {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.freeze-dropdown[open] summary::after { content: "▴"; }
.freeze-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 25;
  display: grid;
  width: min(300px, calc(100vw - 24px));
  max-height: min(48vh, 360px);
  overflow: auto;
  gap: 4px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.freeze-menu label {
  display: flex;
  min-height: 30px;
  align-items: center;
  gap: 7px;
  padding: 3px 5px;
  border-radius: 8px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 12px;
}
.freeze-menu label:hover { background: var(--accent-soft); }
.freeze-menu span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.freeze-empty {
  padding: 6px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 12px;
}
.wrap td:not(.index) {
  white-space: pre-wrap;
  word-break: break-word;
  vertical-align: top;
  overflow: visible;
}
.filter-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--muted);
  background: var(--surface-soft);
  font-family: var(--mono);
  font-size: 12px;
}
.tag-x { border: 0; background: transparent; color: var(--danger); padding: 0 2px; }
.statusbar {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 12px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 12px;
}
.statusbar.visible { display: flex; }
.pagination { justify-content: flex-end; }
.modal-backdrop {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(15, 23, 42, 0.36);
  z-index: 30;
}
.modal-backdrop.visible { display: flex; }
.modal {
  width: min(900px, 96vw);
  max-height: 88vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  border-radius: 16px;
  overflow: hidden;
}
.modal-header, .modal-actions {
  padding: 12px 14px;
  background: var(--surface-soft);
  border-bottom: 1px solid var(--border);
}
.modal-actions {
  justify-content: flex-end;
  border-top: 1px solid var(--border);
  border-bottom: 0;
}
.modal-header strong { display: block; }
.modal-header span { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.editor {
  width: 100%;
  min-height: 260px;
  max-height: 58vh;
  resize: vertical;
  border: 0;
  outline: 0;
  padding: 14px;
  background: var(--surface);
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.65;
}
.toast {
  position: fixed;
  right: 18px;
  bottom: 18px;
  max-width: min(420px, calc(100vw - 36px));
  padding: 10px 12px;
  border-radius: 10px;
  background: #111827;
  color: #fff;
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
  transition: opacity .16s ease, transform .16s ease;
  z-index: 40;
}
.toast.show { opacity: 1; transform: translateY(0); }
.hidden { display: none !important; }
@media (max-width: 760px) {
  .topbar { align-items: flex-start; flex-direction: column; }
  .top-actions, .toolbar-row { width: 100%; }
  .search, .field { flex: 1; min-width: 160px; }
  .statusbar { align-items: flex-start; flex-direction: column; }
}
</style>
</head>
<body>
<div class="app">
  <div class="menu-shell">
    <header class="topbar">
      <div class="brand">
        <h1>轻量 JSON 阅读器</h1>
        <p id="fileMeta">未打开文件 · 单 HTML 离线版</p>
      </div>
      <div class="top-actions">
        <button class="btn primary" id="btnOpen">打开 JSON</button>
        <button class="btn" id="btnSave" disabled>保存</button>
        <button class="btn" id="btnSaveAs" disabled>另存为</button>
        <button class="btn" id="btnTheme">深色</button>
      </div>
    </header>

    <nav class="file-tabs" id="fileTabs" aria-label="已打开文件"></nav>

    <section class="toolbar" id="toolbar">
      <div class="toolbar-row">
        <span class="stats" id="stats">0 行 · 0 列</span>
        <input class="field search" id="searchInput" placeholder="搜索全部列">
        <button class="btn" id="btnWrap">换行</button>
        <button class="btn active" id="btnFreezeHeader">冻结首行</button>
        <button class="btn" id="btnFreezeColumn">冻结首列</button>
        <details class="freeze-dropdown" id="freezeColumnDropdown">
          <summary><span id="freezeSummary">冻结列</span></summary>
          <div class="freeze-menu" id="freezeColumnList"></div>
        </details>
        <label>字号 <input id="fontRange" type="range" min="85" max="135" value="100"></label>
        <label>行距
          <select id="rowDensity">
            <option value="compact">紧凑</option>
            <option value="normal" selected>标准</option>
            <option value="wide">宽松</option>
          </select>
        </label>
        <label>每页
          <select id="pageSize">
            <option>25</option>
            <option selected>50</option>
            <option>100</option>
            <option>200</option>
          </select>
        </label>
      </div>
      <div class="toolbar-row">
        <div class="filter-row">
          <select id="filterColumn"></select>
          <select id="filterOp">
            <option value="contains">包含</option>
            <option value="equals">等于</option>
            <option value="starts">开头是</option>
            <option value="ends">结尾是</option>
            <option value="empty">为空</option>
            <option value="not_empty">不为空</option>
          </select>
          <input class="field" id="filterValue" placeholder="筛选值">
          <button class="btn" id="btnAddFilter">添加筛选</button>
          <button class="btn" id="btnClearFilter">清除筛选</button>
        </div>
      </div>
      <div class="toolbar-row" id="filterTags"></div>
    </section>
  </div>

  <main>
    <div class="upload-zone" id="uploadZone">
      <div class="upload-card">
        <h2>拖入 JSON 文件，或点击打开</h2>
        <p>支持对象数组，嵌套字段会展开成点号列；文件留在本机处理。</p>
        <button class="btn primary" id="btnUploadOpen">选择文件</button>
      </div>
    </div>
    <div class="table-wrap" id="tableWrap"></div>
  </main>

  <footer class="statusbar" id="statusbar">
    <span id="pageInfo">第 0 / 0 页</span>
    <div class="pagination">
      <button class="btn" id="prevPage">上一页</button>
      <button class="btn" id="nextPage">下一页</button>
    </div>
  </footer>
</div>

<input id="fileInput" type="file" accept=".json,application/json" class="hidden" multiple>

<div class="modal-backdrop" id="editorBackdrop">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
    <header class="modal-header">
      <strong id="editorTitle">编辑单元格</strong>
      <span id="editorMeta">Ctrl+Enter 保存，Esc 取消</span>
    </header>
    <textarea class="editor" id="editor"></textarea>
    <footer class="modal-actions">
      <button class="btn" id="btnCancelEdit">取消</button>
      <button class="btn primary" id="btnCommitEdit">保存</button>
    </footer>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const $ = (selector) => document.querySelector(selector);
  const state = {
    docs: [],
    activeDocId: null,
    fileName: '',
    handle: null,
    rows: [],
    columns: [],
    filtered: [],
    filters: [],
    search: '',
    sort: { path: '', dir: '' },
    page: 1,
    pageSize: 50,
    wrap: false,
    freezeHeader: true,
    freezeColumn: false,
    frozenColumnPaths: [],
    dirty: false,
    editing: null,
  };

  const dom = {
    fileMeta: $('#fileMeta'),
    fileTabs: $('#fileTabs'),
    toolbar: $('#toolbar'),
    uploadZone: $('#uploadZone'),
    tableWrap: $('#tableWrap'),
    statusbar: $('#statusbar'),
    stats: $('#stats'),
    searchInput: $('#searchInput'),
    filterColumn: $('#filterColumn'),
    filterOp: $('#filterOp'),
    filterValue: $('#filterValue'),
    filterTags: $('#filterTags'),
    pageSize: $('#pageSize'),
    pageInfo: $('#pageInfo'),
    btnSave: $('#btnSave'),
    btnSaveAs: $('#btnSaveAs'),
    btnWrap: $('#btnWrap'),
    btnFreezeHeader: $('#btnFreezeHeader'),
    btnFreezeColumn: $('#btnFreezeColumn'),
    freezeSummary: $('#freezeSummary'),
    freezeColumnList: $('#freezeColumnList'),
    fileInput: $('#fileInput'),
    toast: $('#toast'),
    editorBackdrop: $('#editorBackdrop'),
    editor: $('#editor'),
    editorTitle: $('#editorTitle'),
    editorMeta: $('#editorMeta'),
  };

  function parseJsonRows(text) {
    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch (error) {
      throw new Error('JSON 解析失败：' + error.message);
    }
    if (!Array.isArray(parsed)) throw new Error('JSON 顶层必须是对象数组');
    parsed.forEach((row, index) => {
      if (!isPlainObject(row)) throw new Error('第 ' + (index + 1) + ' 行不是对象');
    });
    return parsed;
  }

  function isPlainObject(value) {
    return typeof value === 'object' && value !== null && !Array.isArray(value);
  }

  function flattenRows(rows) {
    const columnMap = new Map();
    const flatRows = rows.map((row, rowIndex) => {
      const flat = { __rowIndex: rowIndex };
      flattenValue(row, '', flat, columnMap);
      return flat;
    });
    return { columns: Array.from(columnMap.values()), flatRows };
  }

  function flattenValue(value, path, output, columnMap) {
    if (Array.isArray(value)) {
      if (value.length === 0 && path) {
        output[path] = [];
        addColumn(path, columnMap);
        return;
      }
      value.forEach((item, index) => flattenValue(item, path + '[' + index + ']', output, columnMap));
      return;
    }
    if (isPlainObject(value)) {
      const entries = Object.entries(value);
      if (entries.length === 0 && path) {
        output[path] = {};
        addColumn(path, columnMap);
        return;
      }
      entries.forEach(([key, nestedValue]) => flattenValue(nestedValue, path ? path + '.' + key : key, output, columnMap));
      return;
    }
    if (path) {
      output[path] = value;
      addColumn(path, columnMap);
    }
  }

  function addColumn(path, columnMap) {
    if (!columnMap.has(path)) columnMap.set(path, { path, label: path, width: defaultColumnWidth(path), visible: true });
  }

  function defaultColumnWidth(path) {
    return Math.max(120, Math.min(360, path.length * 9 + 100));
  }

  function createDocument(fileName, handle, rows) {
    const result = flattenRows(rows);
    return {
      id: String(Date.now()) + '-' + Math.random().toString(16).slice(2),
      fileName: fileName || 'data.json',
      handle: handle || null,
      rows,
      columns: result.columns,
      filtered: [],
      filters: [],
      search: '',
      sort: { path: '', dir: '' },
      page: 1,
      pageSize: state.pageSize,
      frozenColumnPaths: [],
      dirty: false,
    };
  }

  function getActiveDoc() {
    return state.docs.find((doc) => doc.id === state.activeDocId) || null;
  }

  function syncActiveDoc() {
    const doc = getActiveDoc();
    if (!doc) return;
    doc.fileName = state.fileName;
    doc.handle = state.handle;
    doc.rows = state.rows;
    doc.columns = state.columns;
    doc.filtered = state.filtered;
    doc.filters = state.filters;
    doc.search = state.search;
    doc.sort = state.sort;
    doc.page = state.page;
    doc.pageSize = state.pageSize;
    doc.frozenColumnPaths = state.frozenColumnPaths;
    doc.dirty = state.dirty;
  }

  function activateDocument(docId) {
    syncActiveDoc();
    const doc = state.docs.find((item) => item.id === docId);
    if (!doc) return;
    state.activeDocId = doc.id;
    state.fileName = doc.fileName;
    state.handle = doc.handle;
    state.rows = doc.rows;
    state.columns = doc.columns;
    state.filtered = doc.filtered;
    state.filters = doc.filters;
    state.search = doc.search;
    state.sort = doc.sort;
    state.page = doc.page;
    state.pageSize = doc.pageSize;
    state.frozenColumnPaths = doc.frozenColumnPaths || [];
    state.dirty = doc.dirty;
    dom.searchInput.value = state.search;
    dom.pageSize.value = String(state.pageSize);
    render();
  }

  function closeDocument(docId) {
    syncActiveDoc();
    const index = state.docs.findIndex((doc) => doc.id === docId);
    if (index < 0) return;
    const doc = state.docs[index];
    if (doc.dirty && !window.confirm('关闭未保存的文件 "' + doc.fileName + '"？')) return;

    const closingActive = state.activeDocId === docId;
    state.docs.splice(index, 1);

    if (!state.docs.length) {
      state.activeDocId = null;
      state.fileName = '';
      state.handle = null;
      state.rows = [];
      state.columns = [];
      state.filtered = [];
      state.filters = [];
      state.search = '';
      state.sort = { path: '', dir: '' };
      state.page = 1;
      state.frozenColumnPaths = [];
      state.dirty = false;
      dom.searchInput.value = '';
      render();
      showToast('已关闭 ' + doc.fileName);
      return;
    }

    if (closingActive) {
      state.activeDocId = null;
      const nextDoc = state.docs[Math.min(index, state.docs.length - 1)];
      activateDocument(nextDoc.id);
    } else {
      render();
    }
    showToast('已关闭 ' + doc.fileName);
  }

  function parsePath(path) {
    const matches = path.matchAll(/([^[.\]]+)|\[(\d+)\]/g);
    return Array.from(matches).map((match) => match[2] === undefined ? match[1] : Number(match[2]));
  }

  function getValueAtPath(row, path) {
    return parsePath(path).reduce((current, segment) => {
      if (current === undefined || current === null) return undefined;
      if (Array.isArray(current) && typeof segment === 'number') return current[segment];
      if (isPlainObject(current) && typeof segment === 'string') return current[segment];
      return undefined;
    }, row);
  }

  function setValueAtPath(row, path, value) {
    const cloned = structuredClone(row);
    const segments = parsePath(path);
    let target = cloned;
    segments.forEach((segment, index) => {
      const last = index === segments.length - 1;
      if (last) {
        target[segment] = value;
        return;
      }
      const nextSegment = segments[index + 1];
      if (target[segment] === undefined || target[segment] === null || typeof target[segment] !== 'object') {
        target[segment] = typeof nextSegment === 'number' ? [] : {};
      }
      target = target[segment];
    });
    return cloned;
  }

  function coerceEditedValue(originalValue, text) {
    if (typeof originalValue === 'number') {
      const n = Number(text);
      return Number.isFinite(n) && text.trim() !== '' ? n : text;
    }
    if (typeof originalValue === 'boolean') {
      if (text === 'true') return true;
      if (text === 'false') return false;
      return text;
    }
    if (originalValue === null) return text === 'null' ? null : text;
    return text;
  }

  function formatValue(value) {
    if (value === undefined) return '';
    if (value === null) return 'null';
    if (typeof value === 'string') return value;
    if (typeof value === 'object') return JSON.stringify(value);
    return String(value);
  }

  async function openWithPicker() {
    if (window.showOpenFilePicker) {
      const handles = await window.showOpenFilePicker({
        multiple: true,
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
      });
      const files = [];
      for (const handle of handles) files.push(await handle.getFile());
      await loadFiles(files, handles);
      return;
    }
    dom.fileInput.click();
  }

  async function loadFile(file, handle) {
    await loadFiles([file], handle ? [handle] : []);
  }

  async function loadFiles(files, handles = []) {
    const loaded = [];
    const errors = [];
    for (let index = 0; index < files.length; index += 1) {
      const file = files[index];
      try {
        const text = await file.text();
        const rows = parseJsonRows(text);
        const doc = createDocument(file.name || 'data.json', handles[index] || null, rows);
        state.docs.push(doc);
        loaded.push(doc);
      } catch (error) {
        errors.push((file.name || '未命名文件') + '：' + error.message);
      }
    }
    if (loaded.length) {
      activateDocument(loaded[loaded.length - 1].id);
      showToast('已打开 ' + loaded.length + ' 个文件' + (errors.length ? '，' + errors.length + ' 个失败' : ''));
      if (errors.length) console.warn(errors.join('\n'));
      return;
    }
    if (errors.length) showToast(errors[0]);
  }

  function rebuildColumns() {
    const previous = new Map(state.columns.map((column) => [column.path, column]));
    const result = flattenRows(state.rows);
    state.columns = result.columns.map((column) => {
      const old = previous.get(column.path);
      return old ? { ...column, width: old.width, visible: old.visible } : column;
    });
  }

  function applyFilters() {
    const { flatRows } = flattenRows(state.rows);
    const query = state.search.trim().toLowerCase();
    let indexes = [];
    flatRows.forEach((flat, flatIndex) => {
      if (query) {
        const hit = state.columns.some((column) => String(formatValue(flat[column.path])).toLowerCase().includes(query));
        if (!hit) return;
      }
      for (const filter of state.filters) {
        if (!testFilter(flat[filter.path], filter)) return;
      }
      indexes.push(flat.__rowIndex);
    });
    if (state.sort.path && state.sort.dir) {
      indexes.sort((a, b) => compareValues(getValueAtPath(state.rows[a], state.sort.path), getValueAtPath(state.rows[b], state.sort.path), state.sort.dir));
    }
    state.filtered = indexes;
  }

  function testFilter(raw, filter) {
    const value = formatValue(raw).toLowerCase();
    const needle = filter.value.toLowerCase();
    if (filter.op === 'contains') return value.includes(needle);
    if (filter.op === 'equals') return value === needle;
    if (filter.op === 'starts') return value.startsWith(needle);
    if (filter.op === 'ends') return value.endsWith(needle);
    if (filter.op === 'empty') return value === '';
    if (filter.op === 'not_empty') return value !== '';
    return true;
  }

  function compareValues(a, b, dir) {
    const na = typeof a === 'number' ? a : Number(a);
    const nb = typeof b === 'number' ? b : Number(b);
    let result;
    if (Number.isFinite(na) && Number.isFinite(nb)) result = na - nb;
    else result = String(formatValue(a)).localeCompare(String(formatValue(b)), 'zh-CN', { numeric: true, sensitivity: 'base' });
    return dir === 'desc' ? -result : result;
  }

  function render() {
    if (state.rows.length) applyFilters();
    syncActiveDoc();
    dom.uploadZone.classList.toggle('hidden', state.rows.length > 0);
    dom.fileTabs.classList.toggle('visible', state.docs.length > 0);
    dom.toolbar.classList.toggle('visible', state.rows.length > 0);
    dom.tableWrap.classList.toggle('visible', state.rows.length > 0);
    dom.statusbar.classList.toggle('visible', state.rows.length > 0);
    dom.btnSave.disabled = !state.rows.length || !state.dirty;
    dom.btnSaveAs.disabled = !state.rows.length;
    dom.btnWrap.classList.toggle('active', state.wrap);
    dom.btnFreezeHeader.classList.toggle('active', state.freezeHeader);
    dom.btnFreezeColumn.classList.toggle('active', state.freezeColumn);
    dom.fileMeta.textContent = state.rows.length ? state.fileName + ' · ' + state.rows.length + ' 行 · ' + state.columns.length + ' 列' + (state.dirty ? ' · 有未保存修改' : '') : '未打开文件 · 单 HTML 离线版';
    renderTabs();
    renderFilters();
    renderTable();
    updateMenuHeight();
  }

  function renderTabs() {
    dom.fileTabs.innerHTML = state.docs.map((doc) => {
      const active = doc.id === state.activeDocId ? ' active' : '';
      const dirty = doc.dirty ? ' *' : '';
      return '<span class="file-tab-wrap"><button class="btn file-tab' + active + '" data-doc="' + escapeAttr(doc.id) + '" title="' + escapeAttr(doc.fileName) + '"><span>' + escapeHtml(doc.fileName + dirty) + '</span></button><button class="tab-close" data-close-doc="' + escapeAttr(doc.id) + '" title="关闭 ' + escapeAttr(doc.fileName) + '" aria-label="关闭 ' + escapeAttr(doc.fileName) + '">x</button></span>';
    }).join('');
    dom.fileTabs.querySelectorAll('[data-doc]').forEach((button) => {
      button.addEventListener('click', () => activateDocument(button.dataset.doc));
    });
    dom.fileTabs.querySelectorAll('[data-close-doc]').forEach((button) => {
      button.addEventListener('click', (event) => {
        event.stopPropagation();
        closeDocument(button.dataset.closeDoc);
      });
    });
  }

  function updateMenuHeight() {
    const menu = document.querySelector('.menu-shell');
    if (!menu) return;
    document.documentElement.style.setProperty('--menu-height', Math.ceil(menu.getBoundingClientRect().height) + 'px');
  }

  function renderFilters() {
    dom.filterColumn.innerHTML = state.columns.map((column) => '<option value="' + escapeAttr(column.path) + '">' + escapeHtml(column.label) + '</option>').join('');
    const visibleColumns = state.columns.filter((column) => column.visible);
    const visiblePaths = new Set(visibleColumns.map((column) => column.path));
    state.frozenColumnPaths = state.frozenColumnPaths.filter((path) => visiblePaths.has(path));
    dom.freezeSummary.textContent = getFreezeSummary();
    dom.freezeColumnList.innerHTML = visibleColumns.length
      ? visibleColumns.map((column) => '<label title="' + escapeAttr(column.label) + '"><input type="checkbox" data-freeze-column="' + escapeAttr(column.path) + '"' + (state.frozenColumnPaths.includes(column.path) ? ' checked' : '') + '><span>' + escapeHtml(column.label) + '</span></label>').join('')
      : '<div class="freeze-empty">无可见列</div>';
    dom.freezeColumnList.querySelectorAll('[data-freeze-column]').forEach((input) => {
      input.addEventListener('change', () => {
        const path = input.dataset.freezeColumn;
        state.frozenColumnPaths = input.checked
          ? Array.from(new Set([...state.frozenColumnPaths, path]))
          : state.frozenColumnPaths.filter((item) => item !== path);
        render();
      });
    });
    dom.filterTags.innerHTML = state.filters.map((filter, index) => '<span class="filter-tag">' + escapeHtml(filter.path + ' ' + opLabel(filter.op) + ' ' + filter.value) + '<button class="tag-x" data-filter="' + index + '">x</button></span>').join('');
    dom.filterTags.querySelectorAll('[data-filter]').forEach((button) => {
      button.addEventListener('click', () => {
        state.filters.splice(Number(button.dataset.filter), 1);
        state.page = 1;
        render();
      });
    });
  }

  function getFreezeSummary() {
    if (!state.frozenColumnPaths.length) return '冻结列';
    if (state.frozenColumnPaths.length === 1) return '冻结：' + state.frozenColumnPaths[0];
    return '冻结 ' + state.frozenColumnPaths.length + ' 列';
  }

  function renderTable() {
    const pageSize = state.pageSize;
    const totalPages = Math.max(1, Math.ceil(state.filtered.length / pageSize));
    if (state.page > totalPages) state.page = totalPages;
    const start = (state.page - 1) * pageSize;
    const pageIndexes = state.filtered.slice(start, start + pageSize);
    const visibleColumns = state.columns.filter((column) => column.visible);
    const visibleFrozenColumns = getVisibleFrozenColumns(visibleColumns);
    const tableWidth = 52 + visibleColumns.reduce((sum, column) => sum + column.width, 0);
    const colgroup = '<col style="width:52px">' + visibleColumns.map((column) => '<col style="width:' + column.width + 'px">').join('');
    const thead = '<thead><tr><th class="index">#</th>' + visibleColumns.map((column) => {
      const classes = [];
      if (state.sort.path === column.path) classes.push('sorted');
      if (visibleFrozenColumns.includes(column)) classes.push('frozen');
      const frozenStyle = getFrozenColumnStyle(column, visibleColumns, visibleFrozenColumns);
      const arrow = state.sort.path === column.path ? (state.sort.dir === 'asc' ? '↑' : '↓') : '↕';
      return '<th class="' + classes.join(' ') + '" data-path="' + escapeAttr(column.path) + '"' + frozenStyle + '><button class="th-button" data-sort="' + escapeAttr(column.path) + '"><span class="th-label">' + escapeHtml(column.label) + '</span><span>' + arrow + '</span></button><button class="resizer" data-resize="' + escapeAttr(column.path) + '" title="拖拽调整列宽，双击恢复"></button></th>';
    }).join('') + '</tr></thead>';
    const tbody = '<tbody>' + pageIndexes.map((rowIndex) => {
      const row = state.rows[rowIndex];
      return '<tr><td class="index">' + (rowIndex + 1) + '</td>' + visibleColumns.map((column) => {
        const value = getValueAtPath(row, column.path);
        const frozen = visibleFrozenColumns.includes(column) ? ' class="frozen"' : '';
        const frozenStyle = getFrozenColumnStyle(column, visibleColumns, visibleFrozenColumns);
        return '<td' + frozen + frozenStyle + ' data-row="' + rowIndex + '" data-path="' + escapeAttr(column.path) + '" title="' + escapeAttr(formatValue(value)) + '">' + linkifyText(formatValue(value)) + '</td>';
    }).join('') + '</tr>';
    }).join('') + '</tbody>';
    dom.tableWrap.classList.toggle('wrap', state.wrap);
    dom.tableWrap.classList.toggle('freeze-header', state.freezeHeader);
    dom.tableWrap.classList.toggle('freeze-column', state.freezeColumn);
    dom.tableWrap.classList.toggle('freeze-selected-column', visibleFrozenColumns.length > 0);
    dom.tableWrap.innerHTML = '<table style="width:' + tableWidth + 'px"><colgroup>' + colgroup + '</colgroup>' + thead + tbody + '</table>';
    dom.stats.textContent = '显示 ' + state.filtered.length + ' / ' + state.rows.length + ' 行 · ' + visibleColumns.length + ' / ' + state.columns.length + ' 列';
    dom.pageInfo.textContent = '第 ' + state.page + ' / ' + totalPages + ' 页';
    bindTableEvents();
  }

  function bindTableEvents() {
    dom.tableWrap.querySelectorAll('[data-sort]').forEach((button) => {
      button.addEventListener('click', () => {
        const path = button.dataset.sort;
        if (state.sort.path !== path) state.sort = { path, dir: 'asc' };
        else if (state.sort.dir === 'asc') state.sort.dir = 'desc';
        else state.sort = { path: '', dir: '' };
        render();
      });
    });
    dom.tableWrap.querySelectorAll('.cell-link').forEach((link) => {
      link.addEventListener('dblclick', (event) => event.stopPropagation());
    });
    dom.tableWrap.querySelectorAll('td[data-path]').forEach((cell) => {
      cell.addEventListener('dblclick', () => openEditor(Number(cell.dataset.row), cell.dataset.path));
    });
    dom.tableWrap.querySelectorAll('[data-resize]').forEach((handle) => bindResize(handle));
  }

  function bindResize(handle) {
    handle.addEventListener('dblclick', (event) => {
      event.stopPropagation();
      const column = state.columns.find((item) => item.path === handle.dataset.resize);
      if (column) column.width = defaultColumnWidth(column.path);
      render();
    });
    handle.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      event.stopPropagation();
      const column = state.columns.find((item) => item.path === handle.dataset.resize);
      if (!column) return;
      const startX = event.clientX;
      const startWidth = column.width;
      handle.classList.add('active');
      handle.setPointerCapture(event.pointerId);
      const move = (moveEvent) => {
        column.width = Math.max(72, Math.min(1200, startWidth + moveEvent.clientX - startX));
        const colIndex = state.columns.filter((item) => item.visible).findIndex((item) => item.path === column.path) + 2;
        dom.tableWrap.querySelectorAll('col:nth-child(' + colIndex + ')').forEach((col) => col.style.width = column.width + 'px');
        const table = dom.tableWrap.querySelector('table');
        if (table) table.style.width = (52 + state.columns.filter((item) => item.visible).reduce((sum, item) => sum + item.width, 0)) + 'px';
      };
      const up = () => {
        handle.classList.remove('active');
        handle.removeEventListener('pointermove', move);
        handle.removeEventListener('pointerup', up);
        handle.removeEventListener('pointercancel', up);
      };
      handle.addEventListener('pointermove', move);
      handle.addEventListener('pointerup', up);
      handle.addEventListener('pointercancel', up);
    });
  }

  function getVisibleFrozenColumns(visibleColumns) {
    const selected = new Set(state.frozenColumnPaths);
    return visibleColumns.filter((column) => selected.has(column.path));
  }

  function getFrozenColumnStyle(column, visibleColumns, visibleFrozenColumns) {
    if (!visibleFrozenColumns.includes(column)) return '';
    const columnIndex = visibleColumns.indexOf(column);
    const offset = visibleColumns.slice(columnIndex + 1).reduce((sum, nextColumn) => (
      visibleFrozenColumns.includes(nextColumn) ? sum + nextColumn.width : sum
    ), 0);
    return ' style="right:' + Math.max(0, Math.round(offset)) + 'px"';
  }

  function openEditor(rowIndex, path) {
    const value = getValueAtPath(state.rows[rowIndex], path);
    state.editing = { rowIndex, path, original: value };
    dom.editorTitle.textContent = '编辑：' + path;
    dom.editorMeta.textContent = '第 ' + (rowIndex + 1) + ' 行 · Ctrl+Enter 保存，Esc 取消';
    dom.editor.value = formatValue(value);
    dom.editorBackdrop.classList.add('visible');
    requestAnimationFrame(() => dom.editor.focus());
  }

  function closeEditor(commit) {
    if (commit && state.editing) {
      const { rowIndex, path, original } = state.editing;
      const newValue = coerceEditedValue(original, dom.editor.value);
      state.rows[rowIndex] = setValueAtPath(state.rows[rowIndex], path, newValue);
      state.dirty = true;
      rebuildColumns();
      showToast('已更新 ' + path);
    }
    state.editing = null;
    dom.editorBackdrop.classList.remove('visible');
    render();
  }

  async function saveOriginal() {
    if (!state.rows.length) return;
    if (!state.handle || !state.handle.createWritable) {
      downloadJson(state.rows, state.fileName || 'data.json');
      state.dirty = false;
      render();
      return;
    }
    const writable = await state.handle.createWritable();
    await writable.write(JSON.stringify(state.rows, null, 2));
    await writable.close();
    state.dirty = false;
    render();
    showToast('已保存到原文件');
  }

  async function saveAs() {
    if (!state.rows.length) return;
    const name = normalizeName(state.fileName || 'data.json');
    if (window.showSaveFilePicker) {
      const handle = await window.showSaveFilePicker({
        suggestedName: name,
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(JSON.stringify(state.rows, null, 2));
      await writable.close();
      state.handle = handle;
      state.fileName = handle.name;
      state.dirty = false;
      render();
      showToast('已另存为 ' + handle.name);
      return;
    }
    downloadJson(state.rows, name);
  }

  function downloadJson(rows, fileName) {
    const blob = new Blob([JSON.stringify(rows, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = normalizeName(fileName);
    a.click();
    URL.revokeObjectURL(url);
  }

  function normalizeName(name) {
    return name.endsWith('.json') ? name : name + '.json';
  }

  function opLabel(op) {
    return { contains: '包含', equals: '等于', starts: '开头是', ends: '结尾是', empty: '为空', not_empty: '不为空' }[op] || op;
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
  }

  function escapeAttr(text) {
    return escapeHtml(text).replace(/`/g, '&#96;');
  }

  const linkPattern = /\b(?:https?:\/\/[^\s<>"'，。；：！？（）]+|mailto:[^\s<>"'，。；：！？（）]+)/gi;
  const trailingPunctuationPattern = /[),.;:!?，。；：！？）]+$/;

  function linkifyText(text) {
    const value = String(text);
    let html = '';
    let cursor = 0;
    for (const match of value.matchAll(linkPattern)) {
      const raw = match[0];
      const start = match.index || 0;
      const trailing = (raw.match(trailingPunctuationPattern) || [''])[0];
      const linkText = trailing ? raw.slice(0, -trailing.length) : raw;
      if (!linkText) continue;
      html += escapeHtml(value.slice(cursor, start));
      html += '<a class="cell-link" href="' + escapeAttr(linkText) + '" target="_blank" rel="noreferrer" title="打开链接">' + escapeHtml(linkText) + '<span aria-hidden="true">↗</span></a>';
      cursor = start + linkText.length;
    }
    html += escapeHtml(value.slice(cursor));
    return html;
  }

  let toastTimer = 0;
  function showToast(text) {
    dom.toast.textContent = text;
    dom.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => dom.toast.classList.remove('show'), 2200);
  }

  $('#btnOpen').addEventListener('click', () => openWithPicker().catch((error) => showToast(error.message)));
  $('#btnUploadOpen').addEventListener('click', () => openWithPicker().catch((error) => showToast(error.message)));
  dom.fileInput.addEventListener('change', (event) => {
    const files = Array.from(event.target.files || []);
    if (files.length) loadFiles(files, []).catch((error) => showToast(error.message));
    dom.fileInput.value = '';
  });
  dom.uploadZone.addEventListener('click', (event) => {
    if (event.target.id !== 'btnUploadOpen') openWithPicker().catch((error) => showToast(error.message));
  });
  dom.uploadZone.addEventListener('dragover', (event) => {
    event.preventDefault();
    dom.uploadZone.classList.add('dragover');
  });
  dom.uploadZone.addEventListener('dragleave', () => dom.uploadZone.classList.remove('dragover'));
  dom.uploadZone.addEventListener('drop', (event) => {
    event.preventDefault();
    dom.uploadZone.classList.remove('dragover');
    const files = Array.from(event.dataTransfer.files || []);
    if (files.length) loadFiles(files, []).catch((error) => showToast(error.message));
  });
  $('#btnSave').addEventListener('click', () => saveOriginal().catch((error) => showToast(error.message)));
  $('#btnSaveAs').addEventListener('click', () => saveAs().catch((error) => showToast(error.message)));
  $('#btnTheme').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    $('#btnTheme').textContent = next === 'dark' ? '浅色' : '深色';
  });
  dom.searchInput.addEventListener('input', () => {
    state.search = dom.searchInput.value;
    state.page = 1;
    render();
  });
  $('#btnWrap').addEventListener('click', () => {
    state.wrap = !state.wrap;
    dom.btnWrap.classList.toggle('active', state.wrap);
    render();
  });
  $('#btnFreezeHeader').addEventListener('click', () => {
    state.freezeHeader = !state.freezeHeader;
    dom.btnFreezeHeader.classList.toggle('active', state.freezeHeader);
    render();
  });
  $('#btnFreezeColumn').addEventListener('click', () => {
    state.freezeColumn = !state.freezeColumn;
    dom.btnFreezeColumn.classList.toggle('active', state.freezeColumn);
    render();
  });
  $('#fontRange').addEventListener('input', (event) => {
    document.documentElement.style.setProperty('--cell-font-size', (13 * Number(event.target.value) / 100) + 'px');
  });
  $('#rowDensity').addEventListener('change', (event) => {
    const map = { compact: '5px', normal: '8px', wide: '13px' };
    document.documentElement.style.setProperty('--row-padding-y', map[event.target.value] || '8px');
  });
  dom.pageSize.addEventListener('change', () => {
    state.pageSize = Number(dom.pageSize.value);
    state.page = 1;
    render();
  });
  $('#prevPage').addEventListener('click', () => {
    if (state.page > 1) {
      state.page -= 1;
      render();
      dom.tableWrap.scrollTop = 0;
    }
  });
  $('#nextPage').addEventListener('click', () => {
    const totalPages = Math.max(1, Math.ceil(state.filtered.length / state.pageSize));
    if (state.page < totalPages) {
      state.page += 1;
      render();
      dom.tableWrap.scrollTop = 0;
    }
  });
  $('#btnAddFilter').addEventListener('click', () => {
    if (!dom.filterColumn.value) return;
    state.filters.push({ path: dom.filterColumn.value, op: dom.filterOp.value, value: dom.filterValue.value });
    dom.filterValue.value = '';
    state.page = 1;
    render();
  });
  $('#btnClearFilter').addEventListener('click', () => {
    state.filters = [];
    state.page = 1;
    render();
  });
  dom.filterOp.addEventListener('change', () => {
    dom.filterValue.disabled = ['empty', 'not_empty'].includes(dom.filterOp.value);
  });
  $('#btnCommitEdit').addEventListener('click', () => closeEditor(true));
  $('#btnCancelEdit').addEventListener('click', () => closeEditor(false));
  dom.editorBackdrop.addEventListener('click', (event) => {
    if (event.target === dom.editorBackdrop) closeEditor(true);
  });
  dom.editor.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeEditor(false);
    if (event.key === 'Enter' && event.ctrlKey) closeEditor(true);
  });
  window.addEventListener('beforeunload', (event) => {
    syncActiveDoc();
    if (!state.docs.some((doc) => doc.dirty)) return;
    event.preventDefault();
    event.returnValue = '';
  });
  window.addEventListener('resize', updateMenuHeight);
  updateMenuHeight();
})();
</script>
</body>
</html>
